[project]
name = "listing-aggregator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "samircd4", email = "samircd4@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.6.3",
    "django>=6.1.2",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "redis>=6.4.0",
    "tenacity>=9.2.1",
]

[project.scripts]
listing-aggregator = "listing_aggregator:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.14.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

